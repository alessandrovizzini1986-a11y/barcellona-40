name: blink-182 Milano monitor

on:
  schedule:
    # Ogni ora: serve a far rispondere il bot ai comandi entro ~1h. Il
    # controllo del concerto in realta' basterebbe una volta al giorno.
    # ~720 run/mese, dentro i 2.000 minuti gratuiti dei repo privati.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lancio manuale dalla tab Actions
  push:
    branches: [main]
    # Nessun paths-ignore: i commit di stato li fa il bot con GITHUB_TOKEN, e
    # GitHub per progetto non fa ripartire i workflow sui push fatti con quel
    # token (niente ricorsione). Cosi' basta modificare state_milano.json dalla
    # UI web per far ripartire il monitor e testare l'avviso di cambiamento.

permissions:
  contents: write   # per salvare state_milano.json e state_bot.json

# Due run insieme si darebbero fastidio su getUpdates e sul commit di stato.
concurrency:
  group: blink-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che i secrets ci siano
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          missing=""
          [ -n "$TG_BOT_TOKEN" ] || missing="$missing TG_BOT_TOKEN"
          [ -n "$TG_CHAT_ID" ]   || missing="$missing TG_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secrets mancanti:$missing"
            echo "Vai su Settings > Secrets and variables > Actions e aggiungili,"
            echo "poi rilancia questo workflow dalla tab Actions (Run workflow)."
            exit 1
          fi
          echo "Secrets presenti."

      - name: Run monitor
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 monitor_blink182.py

      - name: Rispondi ai comandi Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 rispondi_comandi.py

      # always(): se la risposta ai comandi va in errore, lo stato del monitor
      # deve comunque essere salvato, altrimenti al giro dopo rimanda lo stesso
      # avviso. Il run resta rosso e l'errore si vede.
      - name: Commit state
        if: always()
        run: |
          git config user.name "blink-monitor"
          git config user.email "bot@users.noreply.github.com"
          git add state_milano.json state_bot.json || true
          git diff --cached --quiet || git commit -m "update state"
          git push || true
